<div class="flex justify-between items-center px-2.5 py-2 border-l-4 border-solid {{ statusClass() }}">
  <span>{{ id() }}</span>
  <span class="flex items-center gap-2">
    <span>● {{ statusLabel() }}</span>
    @if (isFailed()) {
      <button type="button" class="px-2 py-0.5 border border-error text-error rounded cursor-pointer text-xs" (click)="onRetry()">Retry</button>
    }
  </span>
</div>
