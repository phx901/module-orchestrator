<div
  class="flex justify-between items-center px-2.5 py-2 border-l-4 border-solid {{ statusClass() }}"
>
  <span>{{ id() }}</span>
  <span class="flex items-center gap-2">
    <span>● {{ statusLabel() }}</span>
    @if (isFailed()) {
      <app-button icon="retry" status="error" variant="secondary" (click)="onRetry()" />
    }
  </span>
</div>
