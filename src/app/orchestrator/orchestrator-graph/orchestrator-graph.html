<div class="relative" [style.width.px]="layout().width" [style.height.px]="layout().height">
  <svg class="absolute top-0 left-0 pointer-events-none" [attr.width]="layout().width" [attr.height]="layout().height">
    <defs>
      <marker
        id="arrow"
        viewBox="0 0 10 10"
        refX="8"
        refY="5"
        markerWidth="8"
        markerHeight="8"
        orient="auto-start-reverse"
      >
        <path d="M 0 0 L 10 5 L 0 10 z" style="fill: var(--color-text-faint)" />
      </marker>
    </defs>
    @for (edge of layout().edges; track edge.id) {
      <line
        class="stroke-text-faint"
        [attr.x1]="edge.x1"
        [attr.y1]="edge.y1"
        [attr.x2]="edge.x2"
        [attr.y2]="edge.y2"
        marker-end="url(#arrow)"
      />
    }
  </svg>

  @for (node of layout().nodes; track node.id) {
    <div class="absolute" [style.left.px]="node.x" [style.top.px]="node.y">
      <app-module-card [id]="node.id" [state]="states().get(node.id)" (retry)="retry($event)" />
    </div>
  }
</div>
