<div class="relative" [style.width.px]="layout().width" [style.height.px]="layout().height">
  @for (node of layout().nodes; track node.id) {
    <div class="absolute" [style.left.px]="node.x" [style.top.px]="node.y" [style.width.px]="node.width">
      <app-module-card class="block" [id]="node.id" [state]="states().get(node.id)" (retry)="retry($event)" />
    </div>
  }

  <svg class="absolute top-0 left-0 pointer-events-none" [attr.width]="layout().width" [attr.height]="layout().height">
    @for (edge of layout().edges; track edge.id) {
      <path class="fill-background" [attr.d]="edge.fill" />
      <path
        class="fill-none stroke-text-muted"
        stroke-width="1"
        stroke-linejoin="round"
        [attr.d]="edge.outline"
      />
    }
  </svg>
</div>
